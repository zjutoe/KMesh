[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmesh"
version = "0.1.0"
description = "KMesh research toolkit: minimal bootstrap with environment doctor"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
kmesh = "kmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
